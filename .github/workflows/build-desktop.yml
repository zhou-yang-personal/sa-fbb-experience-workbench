name: Build desktop artifacts

on:
  workflow_dispatch:
  push:
    branches:
      - dev
      - 'codex/**'
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows MSI and EXE
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm install --no-package-lock

      - name: Type-check frontend
        run: npm run check

      - name: Run Rust tests
        working-directory: src-tauri
        # DuckDB is linked statically. Keep tests in the release profile so the
        # following desktop bundle can reuse the same native dependency build.
        run: cargo test --release

      - name: Build Windows desktop bundles
        run: npm run tauri:build

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: sa-fbb-experience-workbench-windows-${{ github.sha }}
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/sa-fbb-experience-workbench.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/sa-fbb-experience-workbench.exe
